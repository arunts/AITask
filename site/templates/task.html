  <header class="page-head">
    <div class="crumbs"><a href="${root}tasks/">Tasks</a><span>›</span>$name</div>
    <h1>$name</h1>
    <p class="lede">$description</p>
    <div class="chips" style="margin-top: 16px">$chips</div>
  </header>

  <div class="task-layout">
    <article class="prose">
      <div class="prompt-label"><h3>System prompt</h3><span class="muted">$system_note</span></div>
      $system_prompt

      <div class="prompt-label"><h3>User prompt</h3><span class="muted">Sent each run with the variables filled in</span></div>
      $user_prompt

$variables_section
$servers_section

      <details class="json">
        <summary>The task file <button class="copy" data-copy="#task-json" type="button">Copy JSON</button></summary>
        <pre><code id="task-json">$json</code></pre>
      </details>
    </article>

    <aside class="aside">
      <div class="box">
        <a class="btn btn-primary btn-lg" href="$file_name" download="$file_name">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          Download task
        </a>
        <span class="btn-note center" style="display:block">$file_name · $file_size</span>
      </div>
    </aside>
  </div>
